# The generated operator docs are what the fab reads. This fails a push or PR whose HTML
# was not regenerated from its Markdown, whose publish lists disagree, or whose package
# table in docs/dev/nuget-packages.md no longer matches the app's csproj.
# (The .NET build and tests need the local NuGet feed and Windows, so they are not here.)
name: docs

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated HTML is current; publish lists agree; package table matches
        run: python3 tools/check-docs.py
